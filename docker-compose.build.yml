# ─────────────────────────────────────────────────────────────────────────────
# myDashboard – local build compose file
#
# Builds the image from source and runs it exactly like docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
#
# To run the pre-built image from GHCR instead, use:
#   docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  docker-gateway:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: ghcr.io/patbaumgartner/my-dashboard:${VERSION:-dev}

  mydashboard:
    image: ghcr.io/patbaumgartner/my-dashboard:${VERSION:-dev}
